name: decision-lab-offline

on:
  pull_request:
    paths:
      - 'src/llm_quant/decision_lab/**'
      - 'tests/test_decision_lab*.py'
      - 'config/decision_lab/**'
      - '.github/workflows/decision-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the focused test dependencies
        run: pip install --disable-pip-version-check numpy==2.3.5 pytest==9.0.2
      - name: Run offline data and model contracts
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/llm_quant/decision_lab
          python -m pytest -q tests/test_decision_lab*.py
          python -m llm_quant.decision_lab demo
          python -m llm_quant.decision_lab project config/decision_lab/project.example.json
