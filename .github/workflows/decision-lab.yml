name: decision-lab-offline

on:
  pull_request:
    paths:
      - 'src/llm_quant/decision_lab/**'
      - '.claude/skills/**'
      - 'requirements/integrations/**'
      - 'scripts/check_quant_integrations.py'
      - 'scripts/check_native_integration_results.py'
      - 'tests/test_decision_lab*.py'
      - 'tests/test_research_docs.py'
      - 'tests/README.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'RESEARCH_POLICY.md'
      - '.claude/agents/**'
      - 'requirements/**'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - 'data/README.md'
      - 'reports/README.md'
      - 'research/README.md'
      - 'scripts/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'config/decision_lab/**'
      - '.github/workflows/**'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements/research-py313.lock
      - name: Install pinned offline research environment
        run: python -m pip install --disable-pip-version-check -r requirements/research-py313.lock
      - name: Run offline contracts and reproducibility checks
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_decision_lab*.py tests/test_research_docs.py
          python scripts/check_research_docs.py
          python scripts/check_research_standards.py --environment
          python scripts/check_quant_integrations.py
          python -m llm_quant.decision_lab.catalog --check
          python -m compileall -q src/llm_quant/decision_lab
          python -m llm_quant.decision_lab demo
          python -m llm_quant.decision_lab project config/decision_lab/project.example.json
          python -m llm_quant.decision_lab.benchmark --reference --out research-local/reference-a.json
          python -m llm_quant.decision_lab.benchmark --reference --out research-local/reference-b.json
          cmp research-local/reference-a.json research-local/reference-b.json
