name: Daily Reports

on:
  schedule:
    - cron: '0 22 * * 1-5'  # Existing cadence; no new scheduled work.
  workflow_dispatch:
    inputs:
      date:
        description: 'Report date (YYYY-MM-DD)'
        required: false
      type:
        description: 'Report type'
        required: false
        default: 'daily'
        type: choice
        options: [daily, weekly, monthly]

permissions:
  contents: write

concurrency:
  group: daily-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require an existing evidence database
        run: |
          if [ ! -s data/llm_quant.duckdb ]; then
            echo '::error::No source database is available. Restore a verified private snapshot; never initialize an empty database to publish performance.'
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e .

      - name: Set and validate report date
        id: date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
          import os
          from datetime import UTC, date, datetime
          value = os.environ.get('REQUESTED_DATE') or datetime.now(UTC).date().isoformat()
          parsed = date.fromisoformat(value)
          if parsed.isoformat() != value or parsed > datetime.now(UTC).date():
              raise ValueError('Report date must be an ISO date, not in the future')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'report_date={value}\n')
          PY

      - name: Generate daily report
        if: inputs.type == '' || inputs.type == 'daily'
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        run: PYTHONPATH=src python scripts/generate_report.py daily --date "$REPORT_DATE"

      - name: Generate weekly report (Monday or manual)
        if: inputs.type == 'weekly' || (inputs.type == '' && github.event_name == 'schedule')
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
          REPORT_TYPE: ${{ inputs.type }}
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "$REPORT_TYPE" = 'weekly' ]; then
            PYTHONPATH=src python scripts/generate_report.py weekly --date "$REPORT_DATE"
          fi

      - name: Generate monthly report (1st of month or manual)
        if: inputs.type == 'monthly' || (inputs.type == '' && github.event_name == 'schedule')
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
          REPORT_TYPE: ${{ inputs.type }}
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "$REPORT_TYPE" = 'monthly' ]; then
            PYTHONPATH=src python scripts/generate_report.py monthly --date "$REPORT_DATE"
          fi

      - name: Refuse to publish reports without portfolio evidence
        env:
          PYTHONPATH: src
        run: python -m llm_quant.decision_lab.evidence --changed-reports

      - name: Commit and push reports
        env:
          REPORT_DATE: ${{ steps.date.outputs.report_date }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d reports ] && [ -n "$(git status reports/ --porcelain)" ]; then
            git add reports/
            git commit -m "docs: daily report $REPORT_DATE [automated]"
            git push
          else
            echo 'No new reports to commit.'
          fi
